# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: paula640/first-try
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/84f7ed25-3df5-408a-a21c-2550fdf87f5b/pkce
  auth_token_endpoint: /sites/84f7ed25-3df5-408a-a21c-2550fdf87f5b/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://cariboucalvary.netlify.app

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "events"
    label: "Events"
    files:
      - name: "events"
        label: "Upcoming Events"
        file: "data/events.json"
        format: "json"
        fields:
          - label: "Events"
            name: "events"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "string", hint: "Format: YYYY-MM-DD, for example 2026-12-24" }
              - { label: "Time", name: "time", widget: "string", required: false }
              - { label: "Location", name: "location", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }

  - name: "bulletin"
    label: "Bulletin"
    files:
      - name: "bulletin"
        label: "Church Bulletin"
        file: "data/bulletin.json"
        format: "json"
        fields:
          - { label: "Current bulletin title", name: "current_title", widget: "string", default: "This Week's Bulletin" }
          - { label: "Current bulletin PDF", name: "current", widget: "file", required: false }
          - label: "Past bulletins"
            name: "archive"
            widget: "list"
            required: false
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "string", hint: "Format: YYYY-MM-DD" }
              - { label: "PDF", name: "file", widget: "file" }
